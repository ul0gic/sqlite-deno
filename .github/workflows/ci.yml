name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gate only reads the repository. No write scope anywhere.
permissions:
  contents: read

# Cancel superseded runs on the same ref; a newer push/PR update supersedes the old gate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (fmt, lint, check, biome, test)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: "2.8.1"

      # Pre-fetch and verify the committed lockfile so a tampered or drifted
      # dependency fails here, before any code runs (--frozen rejects lock drift).
      - name: Cache and verify dependencies
        run: deno install --frozen

      # deno task check = fmt --check && lint && check && lint:biome && test -A.
      # lint:biome fetches the pinned, checksum-verified Biome binary (DEC-005);
      # the download is the only network access the gate performs and is sandboxed
      # to a GitHub release asset whose sha256 is recorded in tools/biome.sha256.
      - name: Gate
        run: deno task check

  provenance-verify:
    name: provenance-verify (committed wasm == pinned official release)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: "2.8.1"

      # DEC-012: re-fetch the pinned @sqlite.org/sqlite-wasm tarball, verify its
      # shasum, and byte-compare to the committed src/wasm/. The transient fetch
      # is scoped to the npm registry and happens ONLY here — never at install or
      # runtime. A mismatch fails the job (typed error, non-zero exit).
      - name: Verify vendored wasm provenance
        run: deno task verify
