name: publish

# Tag-driven release (`git tag v0.1.0 && git push --tags`); never fires on a plain push.
# workflow_dispatch is the manual escape hatch for the first run / re-runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege at the top level; the publish job escalates only what it needs.
permissions:
  contents: read

# Cancel a superseded run for the same tag/dispatch ref.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish (gate + verify + deno publish, OIDC provenance)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # id-token: write is mandatory — it lets `deno publish` authenticate to JSR
      # via OIDC (no token, no secret) and emit signed build provenance. (DEC-012)
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.8.1"

      # --frozen rejects lockfile drift before any code runs.
      - name: Cache and verify dependencies
        run: deno install --frozen

      # Full gate: a red tree never ships. fmt --check, lint, check, biome, test -A.
      - name: Gate
        run: deno task check

      # DEC-012: byte-compare the committed wasm to the pinned official release
      # before publishing the bytes the world will trust.
      - name: Verify vendored wasm provenance
        run: deno task verify

      # Dry-run is the last gate before the irreversible publish: slow-type and
      # exports-resolution failures abort here without burning the immutable version.
      - name: Publish dry-run
        run: deno publish --dry-run

      # No --token: id-token: write + the JSR-linked repo drive OIDC auth and
      # provenance automatically.
      - name: Publish to JSR
        run: deno publish
